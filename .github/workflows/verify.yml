name: Verify reliability contracts
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tests/Verify -c Release
      - run: dotnet run --project src/Demo -c Release -- artifacts/traces.json
      - name: Reproduce checked-in trace bytes
        run: python scripts/compare_traces.py
      - run: python scripts/build_demo.py --check
      - name: Packaging safety contracts
        run: python scripts/test_package.py
      - name: Build exact Git source package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/package.py --commit "$env:SOURCE_SHA"
        shell: pwsh
      - name: Inspect actual source package against Git
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/check_package.py --directory artifacts/release-v0.1.2-preview.1 --commit "$env:SOURCE_SHA" --repository .
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: checked-source-${{ matrix.os }}
          path: artifacts/release-v0.1.2-preview.1/
          if-no-files-found: error
  compare-packages:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: checked-source-*
          path: checked
      - name: Compare the two checked packages without rebuilding
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          directories = sorted(Path('checked').iterdir())
          assert len(directories) == 2
          expected = {'service-reliability-lab-v0.1.2-preview.1.zip', 'service-reliability-demo.html', 'BUILD-MANIFEST.json', 'SIGNING-PUBLIC-KEY.pub', 'SHA256SUMS.txt'}
          for directory in directories:
              assert {p.name for p in directory.iterdir()} == expected
          hashes = {}
          for name in sorted(expected):
              first, second = [(directory / name).read_bytes() for directory in directories]
              assert first == second, name
              hashes[name] = hashlib.sha256(first).hexdigest()
          print(json.dumps({'status': 'BOTH_OS_PACKAGES_BYTE_IDENTICAL_NO_REBUILD', 'sha256': hashes}, sort_keys=True))
