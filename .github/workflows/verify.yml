name: Verify reliability contracts
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Main, tag and manual runs never share a pending/cancelling group.
  # A PR uses its complete merge-base delta, so its newer run includes earlier source changes.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_policy:
    name: Changed files and documentation policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify event and documentation contracts
        run: python3 -m unittest discover -s .github/ci -p test_policy.py -v
      - name: Classify complete change and validate documentation
        id: scope
        run: python3 .github/ci/policy.py gate
      - name: Check actual workflow syntax and expressions
        run: python3 .github/ci/policy.py lint
  verify:
    needs: ci_policy
    if: needs.ci_policy.outputs.native == 'true'
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_HOST: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Own caps and exact SDK10 inputs then original cases
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,subprocess,sys
          text=(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.github/workflows/verify.yml').read_text()
          lines=text.splitlines()
          start=lines.index('# PROJECT12_PAYLOAD_BEGIN')+1
          stop=lines.index('# PROJECT12_PAYLOAD_END')
          raw=base64.b64decode(''.join(x[2:] for x in lines[start:stop] if x.startswith('# ')),validate=True)
          if hashlib.sha256(raw).hexdigest()!='782fa9f702476a1a9f4212e7456807480319a0659664f26fcabedecd3c651aaa':raise SystemExit('SDK0: own transport')
          data=json.loads(gzip.decompress(raw))
          if data['schema']!='project12-own-hosted-controller/v1' or set(data['files'])!={'controller.py','windows_backend.py'}:raise SystemExit('SDK0: own source set')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'project12-owned'
          target.mkdir()
          for name,row in data['files'].items():
              b=base64.b64decode(row['base64'],validate=True)
              if hashlib.sha256(b).hexdigest()!=row['sha256']:raise SystemExit('SDK0: own source bytes')
              with (target/name).open('xb') as f:f.write(b)
          subprocess.run([sys.executable,str(target/'controller.py')],check=True)
      - uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 7 || 3 }}
          name: checked-source-${{ matrix.os }}
          path: artifacts/release-v0.1.3-preview.1/
          if-no-files-found: error
  compare-packages:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: checked-source-*
          path: checked
      - name: Compare the two checked packages without rebuilding
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          directories = sorted(Path('checked').iterdir())
          assert len(directories) == 2
          expected = {'service-reliability-lab-v0.1.3-preview.1.zip', 'service-reliability-demo.html', 'BUILD-MANIFEST.json', 'SIGNING-PUBLIC-KEY.pub', 'SHA256SUMS.txt'}
          for directory in directories:
              assert {p.name for p in directory.iterdir()} == expected
          hashes = {}
          for name in sorted(expected):
              first, second = [(directory / name).read_bytes() for directory in directories]
              assert first == second, name
              hashes[name] = hashlib.sha256(first).hexdigest()
          print(json.dumps({'status': 'BOTH_OS_PACKAGES_BYTE_IDENTICAL_NO_REBUILD', 'sha256': hashes}, sort_keys=True))

